name: "CodeQL Advanced"

# Job names, step names, and matrix shape follow GitHub's canonical
# "CodeQL Advanced" Code Scanning template exactly. The Code Scanning UI
# registers configurations keyed off `(workflow_path, job_id, category)`
# tuples and shows status using template-default identifiers; deviating
# from those names produces orphan configuration cards in the UI that
# can't be cleaned up via API (PR-merge analyses are non-deletable).
#
# `actions` covers workflow files; `javascript-typescript` covers any JS/TS in
# the repo (browser-test scaffolding, etc.).
#
# `java-kotlin` runs in `manual` mode, building only `compileAndroidMain`. The
# `com.android.kotlin.multiplatform.library` plugin emits real JVM `.class`
# files under `build/classes/kotlin/android/main/`, which is what CodeQL's
# Kotlin extractor (LD_PRELOAD on JVM `kotlinc`) can ingest. Earlier attempts
# with `compileKotlinMetadata` failed because the metadata compiler emits
# `.knm` files via a different frontend the tracer doesn't hook.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Weekly periodic scan catches supply-chain CVEs that appear after merge.
  schedule:
    - cron: '44 16 * * 0'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      # required for SARIF upload
      security-events: write
      # required by codeql-action/analyze@v4 in private repos
      actions: read
      # required to fetch internal or private CodeQL packs from GHCR
      packages: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up JDK 21
        if: matrix.build-mode == 'manual'
        uses: actions/setup-java@v5.2.0
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@v6.1.0

      # JDK + Gradle setup only for java-kotlin; the source-only languages
      # don't run any build at all.
      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5.2.0
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v6.1.0

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Restores+stores the CodeQL bundle and dependency cache between
          # runs. Default off in Advanced Setup; turning on cuts ~30-60s
          # off the init step on warm cache.
          dependency-caching: true

      # Manual build: only java-kotlin gates this. The CodeQL Java agent
      # is attached to every JVM in this step via JAVA_TOOL_OPTIONS — every
      # conforming JVM honors -javaagent at startup independently of any
      # OS-level LD_PRELOAD tracing chain. The `java,kotlin` spec registers
      # both JavacMainInterceptor and KotlinInterceptor; the latter hooks
      # `K2JVMCompiler.doExecute(...)` at class load time and writes
      # per-source-file `*.kt.trap.gz` outputs under
      # ${CODEQL_EXTRACTOR_JAVA_TRAP_DIR}.
      - name: Run manual build steps
        if: matrix.build-mode == 'manual'
        run: |
          export JAVA_TOOL_OPTIONS="-javaagent:${CODEQL_EXTRACTOR_JAVA_ROOT}/tools/codeql-java-agent.jar=java,kotlin"
          echo "JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS}"
          ./gradlew --no-daemon codeqlCompileJvm --no-configuration-cache

      - name: Compile Android Kotlin (JVM bytecode) for CodeQL extraction
        if: matrix.build-mode == 'manual'
        shell: bash
        # `compileAndroidMain` is the only KMP compilation in this repo that
        # emits JVM `.class` files (`com.android.kotlin.multiplatform.library`
        # plugin). That's what CodeQL's Kotlin extractor's LD_PRELOAD tracer
        # can hook.
        #
        # `--rerun-tasks` defeats Gradle's up-to-date check and any restored
        # build cache from setup-gradle, ensuring kotlinc is actually invoked.
        #
        # `kotlin.compiler.execution.strategy=out-of-process` spawns a fresh
        # kotlinc JVM per compilation (instead of the long-lived `daemon`
        # default or function-call `in-process` mode). The tracer hooks new
        # process invocations, so out-of-process gives it a process exec to
        # intercept.
        run: |
          ./gradlew compileAndroidMain \
            --rerun-tasks \
            -Pkotlin.compiler.execution.strategy=out-of-process \
            --no-configuration-cache \
            --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
