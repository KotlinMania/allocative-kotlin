[versions]
kotlin = "2.4.21"
coroutines = "1.11.0"
datetime = "0.8.0"
collectionsImmutable = "0.5.2"
anyhow = "0.1.1"
ctor = "0.1.0"
either = "0.1.1"
futures = "0.2.0"
indexmap = "0.1.4"
onceCell = "0.1.1"
serde = "0.1.11"
serdeJson = "0.1.1"
tokio = "0.1.1"
androidKmp = "9.4.1"
detekt = "2.0.0-alpha.6"
ktlint = "14.2.0"
ktlintEngine = "1.8.0"
kotlinxBenchmark = "0.5.0"

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidKmp" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kotlinx-benchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "kotlinxBenchmark" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collectionsImmutable" }
anyhow-kotlin = { module = "io.github.kotlinmania:anyhow-kotlin", version.ref = "anyhow" }
ctor-kotlin = { module = "io.github.kotlinmania:ctor-kotlin", version.ref = "ctor" }
either-kotlin = { module = "io.github.kotlinmania:either-kotlin", version.ref = "either" }
futures-kotlin = { module = "io.github.kotlinmania:futures-kotlin", version.ref = "futures" }
indexmap = { module = "io.github.kotlinmania:indexmap-kotlin", version.ref = "indexmap" }
once-cell-kotlin = { module = "io.github.kotlinmania:once-cell-kotlin", version.ref = "onceCell" }
serde-kotlin = { module = "io.github.kotlinmania:serde-kotlin", version.ref = "serde" }
serde-json-kotlin = { module = "io.github.kotlinmania:serde-json-kotlin", version.ref = "serdeJson" }
tokio-kotlin = { module = "io.github.kotlinmania:tokio-kotlin", version.ref = "tokio" }
kotlinx-benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "kotlinxBenchmark" }

[bundles]
allocative-commonMain = [
  "kotlinx-coroutines-core",
  "kotlinx-datetime",
  "collections-immutable",
  "anyhow-kotlin",
  "ctor-kotlin",
  "either-kotlin",
  "futures-kotlin",
  "indexmap",
  "once-cell-kotlin",
  "serde-kotlin",
  "serde-json-kotlin",
  "tokio-kotlin",
]
